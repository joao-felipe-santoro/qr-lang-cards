<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lang Card Reader</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <style>
      /* Lang-card specific overrides */
      .lang-blocks { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 8px; }
      .lang-block {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        background: rgba(0,0,0,0.15);
      }
      .lang-block:first-child { border-color: #4f7cff; }
      .lang-label {
        font-size: 0.7rem; text-transform: uppercase;
        letter-spacing: 0.08em; opacity: 0.5; min-width: 56px;
      }
      .lang-word { font-size: 1.6rem; font-weight: 700; }
      .lang-card-id {
        font-size: 0.7rem; text-transform: uppercase;
        letter-spacing: 0.1em; opacity: 0.4; margin-bottom: 4px;
      }
      .lang-timestamp { font-size: 0.75rem; opacity: 0.4; margin-top: 8px; }
      .unknown-banner {
        padding: 14px 18px; border-radius: 10px;
        border: 1px solid #ef4444; color: #ef4444;
        background: rgba(239,68,68,0.1); text-align: center; width: 100%;
      }
      .scan-card-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; font-size: 0.85rem;
      }
      .scan-card-id { font-weight: 600; }
      .scan-card-time { opacity: 0.5; font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <div>
      <div class="header">
        <h1 class="arduino-text">Lang Card Reader</h1>
        <img class="arduino-logo" src="./img/logo.svg" alt="Arduino Logo" />
      </div>

      <div class="main-content">
        <div class="container">
          <div id="videoFeedContainer">
            <canvas id="videoCanvas" width="640" height="360">
              O seu browser não suporta canvas.
            </canvas>
          </div>
          <div id="cameraStatus" class="camera-status">
            <div class="search">
              <img class="icon" src="./img/lens.svg" alt="Lens" />
              <span>Procurando QR code...</span>
            </div>
            <div class="search-small">Aponte uma carta para a câmera</div>
          </div>
          <div id="scanInfo"></div>
          <div id="rescan-button-container" style="display: none">
            <button id="rescanButton" onclick="rescan()">Escanear outra carta</button>
          </div>
        </div>

        <div class="container container-scans">
          <div class="recent-scans-title-container">
            <h2 class="recent-scans-title">Leituras recentes</h2>
            <img
              id="delete-scan"
              class="delete-scan-logo"
              style="display: none"
              src="./img/delete-scan.svg"
              alt="Limpar"
              onclick="clearRecentScans()" />
          </div>
          <ul id="recentScansList"></ul>
          <div id="initialListError" class="error-message" style="display: none"></div>
          <div id="scanMessage" style="display: none">Apenas as últimas 5 leituras são salvas</div>
        </div>
      </div>
      <div id="error-container" class="error-message" style="display: none"></div>
    </div>

    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <script src="app.js"></script>
  </body>
</html>
