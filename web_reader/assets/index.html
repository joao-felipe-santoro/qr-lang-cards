<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lang Card Reader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f1a;
      --surface:  #1a1a2e;
      --border:   #2a2a4a;
      --accent:   #4f7cff;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header h1 span { color: var(--accent); }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    #status-dot.connected  { background: var(--green); }
    #status-dot.playing    { background: var(--accent); animation: pulse 1s infinite; }
    #status-dot.error      { background: var(--red); }

    #status-label { font-size: 0.85rem; color: var(--muted); margin-right: auto; }

    button {
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    button:hover { background: var(--border); }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
    }

    /* ── Camera panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      padding: 12px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    #camera-feed {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: #000;
      display: block;
    }

    /* ── Card result panel ── */
    #result-panel {
      display: flex;
      flex-direction: column;
    }

    #result-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    #waiting-msg {
      text-align: center;
      color: var(--muted);
    }
    #waiting-msg .icon { font-size: 3rem; margin-bottom: 8px; }
    #waiting-msg p { font-size: 0.9rem; }

    #card-display { display: none; width: 100%; }

    #card-id {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 8px;
    }

    .lang-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lang-block:first-of-type  { border-color: var(--accent); }

    .lang-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      min-width: 60px;
    }
    .lang-word {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }

    #scan-timestamp {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }

    /* ── History ── */
    #history-section {
      padding: 0 20px 20px;
    }

    #history-section h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .history-item .hcard { font-weight: 600; }
    .history-item .htime { color: var(--muted); font-size: 0.75rem; }

    .unknown-banner {
      background: #2d1515;
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 14px 20px;
      color: var(--red);
      text-align: center;
      font-size: 0.9rem;
      width: 100%;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div id="status-dot"></div>
    <h1>Lang Card <span>Reader</span></h1>
    <span id="status-label">Desconectado</span>
    <button onclick="resetDetection()">🔄 Nova leitura</button>
  </header>

  <main>
    <!-- Camera -->
    <div class="panel">
      <div class="panel-title">Câmera ao vivo</div>
      <img id="camera-feed" src="/stream" alt="Camera feed" />
    </div>

    <!-- Result -->
    <div class="panel" id="result-panel">
      <div class="panel-title">Carta detectada</div>
      <div id="result-content">
        <div id="waiting-msg">
          <div class="icon">📷</div>
          <p>Aponte uma carta QR para a câmera</p>
        </div>
        <div id="card-display">
          <div id="card-id"></div>
          <div id="lang-blocks"></div>
          <div id="scan-timestamp"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- History -->
  <section id="history-section">
    <h2>Últimas leituras</h2>
    <div id="history-list">
      <div class="history-item"><span class="htime">Nenhuma leitura ainda</span></div>
    </div>
  </section>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
